<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Bombas Pro Naval</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">⚓ <span>Bombas Pro Naval</span></div>
  <div class="lang-picker">
    <button onclick="setLang('es')">ES</button>
    <button onclick="setLang('gl')">GL</button>
  </div>
</header>

<main class="main-scroll">
  <div class="sec">1. Selección de Equipo</div>
  <div class="card">
    <select id="sectorSel" class="ios-select" onchange="filterMakers()" style="width:100%">
      <option value="naval">🚢 Sector Naval (Azcue, Thune Eureka...)</option>
      <option value="global">🌍 Industrial (Grundfos, KSB...)</option>
    </select>
    <select id="makerSel" class="ios-select" style="width:100%; margin-top:10px;"></select>
  </div>

  <div class="sec">2. Accesorios en Succión</div>
  <div class="card">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <div><label class="fl">Codos 90º</label><input type="number" id="acc_codo" class="ios-inp" value="0"></div>
      <div><label class="fl">Válv. Globo</label><input type="number" id="acc_globo" class="ios-inp" value="0"></div>
      <div><label class="fl">Filtro Aspiración</label><input type="number" id="acc_filt" class="ios-inp" value="0"></div>
      <div><label class="fl">NPSH Disp (m)</label><input type="number" id="npshDisp" class="ios-inp" value="6.0"></div>
    </div>
  </div>

  <div class="sec">3. Análisis de Catálogo</div>
  <div class="card">
    <label class="btn-start" style="display:block; text-align:center; background:#007AFF; color:#fff; cursor:pointer;">
      📁 ABRIR PDF O CÁMARA
      <input type="file" id="fileInp" accept="application/pdf,image/*" capture="environment" style="display:none" onchange="handleImport(event)">
    </label>
    <canvas id="pdfCanvas" style="width:100%; display:none; margin-top:10px; border-radius:8px; border:1px solid #ccc;"></canvas>
  </div>

  <button class="btn-start" style="width:100%; background:#28a745; color:white; margin:20px 0;" onclick="generarYCompartir()">
    📤 ENVIAR INFORME WHATSAPP
  </button>
</main>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
  }
</script>
</body>
</html>
