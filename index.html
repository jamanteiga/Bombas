<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bombas Pro AI v33</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; background: #0f172a; }
        #pdfCanvas { width: 100%; border-radius: 1.5rem; touch-action: none; cursor: crosshair; }
        .ai-glow { box-shadow: 0 0 15px rgba(34, 211, 238, 0.4); }
    </style>
</head>
<body class="text-slate-100 min-h-screen">

<header class="bg-slate-900/80 backdrop-blur-md p-6 sticky top-0 z-50 border-b border-slate-800">
    <div class="flex justify-between items-center max-w-md mx-auto">
        <h1 class="text-lg font-black tracking-tighter italic text-cyan-400">⚓ BOMBAS PRO <span class="text-white">AI</span></h1>
        <div id="aiStatus" class="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
            <div class="w-2 h-2 bg-slate-500 rounded-full animate-pulse" id="aiDot"></div>
            <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Engine Offline</span>
        </div>
    </div>
</header>

<main class="p-4 max-w-md mx-auto space-y-6">

    <div class="bg-slate-800/50 p-5 rounded-3xl border border-slate-700/50 space-y-4">
        <input type="text" id="pumpTag" placeholder="Tag de la Bomba" class="w-full p-4 bg-slate-900 rounded-2xl border border-slate-700 outline-none text-cyan-50">
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 p-3 rounded-2xl border border-slate-700">
                <label class="text-[9px] font-bold text-slate-500 uppercase">Q Req (m³/h)</label>
                <input type="number" id="qReq" value="25" class="w-full bg-transparent text-xl font-bold outline-none text-white">
            </div>
            <div class="bg-slate-700/30 p-3 rounded-2xl border border-slate-600">
                <label class="text-[9px] font-bold text-slate-500 uppercase">H Req (m)</label>
                <input type="number" id="hReq" value="30" class="w-full bg-transparent text-xl font-bold outline-none text-white">
            </div>
        </div>
    </div>

    <div id="calibPanel" class="hidden bg-slate-900 p-5 rounded-3xl border-2 border-cyan-500/50 ai-glow space-y-4">
        <div class="flex justify-between items-center">
            <span class="text-[10px] font-black text-cyan-400 uppercase tracking-widest">Calibration Matrix</span>
            <span class="text-[10px] text-slate-500" id="stepCounter">Paso 1/3</span>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-[9px] text-slate-400 uppercase">Valor H Máximo</label>
                <input type="number" id="hMaxScale" value="50" class="w-full bg-slate-800 p-3 rounded-xl font-bold outline-none border border-slate-700">
            </div>
            <div class="space-y-1">
                <label class="text-[9px] text-slate-400 uppercase">Valor Q Máximo</label>
                <input type="number" id="qMaxScale" value="100" class="w-full bg-slate-800 p-3 rounded-xl font-bold outline-none border border-slate-700">
            </div>
        </div>
        
        <div class="flex gap-2">
            <button onclick="resetApp()" class="flex-1 bg-slate-800 p-3 rounded-xl text-[10px] font-bold uppercase">Reset</button>
            <button onclick="lockScale()" id="btnLock" class="flex-[2] bg-cyan-600 p-3 rounded-xl text-[10px] font-black text-slate-900 uppercase">Fijar y Analizar</button>
        </div>
    </div>

    <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <label class="bg-slate-800 p-4 rounded-2xl text-center text-xs font-bold border border-slate-700 cursor-pointer">
                📂 PDF
                <input type="file" accept="application/pdf" class="hidden" onchange="handleImport(event, 'pdf')">
            </label>
            <label class="bg-cyan-700 p-4 rounded-2xl text-center text-xs font-bold cursor-pointer shadow-lg shadow-cyan-900/20">
                📷 CÁMARA
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImport(event, 'img')">
            </label>
        </div>

        <div id="statusMsg" class="text-center text-[10px] text-cyan-400 font-bold bg-cyan-900/20 p-2 rounded-lg hidden"></div>
        <canvas id="pdfCanvas" class="hidden"></canvas>
    </div>

    <button onclick="generarInforme()" id="btnFinal" class="w-full bg-emerald-600 p-5 rounded-[2rem] font-black text-sm uppercase tracking-widest shadow-xl shadow-emerald-
