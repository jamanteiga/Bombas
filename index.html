<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bombas Pro AI - Vision Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; background: #020617; }
        #pdfCanvas { width: 100%; border-radius: 1.5rem; touch-action: none; transition: filter 0.3s ease; }
        .vision-enhanced { filter: contrast(1.4) grayscale(1); }
    </style>
</head>
<body class="text-slate-100 min-h-screen">

<header class="bg-slate-900/90 backdrop-blur-md p-5 sticky top-0 z-50 border-b border-cyan-900/30">
    <div class="flex justify-between items-center max-w-md mx-auto">
        <h1 class="text-lg font-black tracking-tighter italic text-cyan-400">⚓ BOMBAS PRO <span class="text-white">VISION</span></h1>
        <div class="flex gap-2">
            <div id="aiStatus" class="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse" id="aiDot"></div>
                <span class="text-[8px] font-bold uppercase tracking-widest text-cyan-400">AI Active</span>
            </div>
        </div>
    </div>
</header>

<main class="p-4 max-w-md mx-auto space-y-6">

    <div id="visionControls" class="hidden bg-slate-900/80 p-4 rounded-3xl border border-cyan-500/30 space-y-3">
        <div class="flex justify-between items-center text-[10px] font-bold uppercase text-slate-400">
            <span>Filtros de Visión Artificial</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggleVision" class="sr-only peer" checked onchange="toggleEnhancement()">
                <div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-600"></div>
            </label>
        </div>
    </div>

    <div class="relative group">
        <div id="statusMsg" class="absolute top-4 left-1/2 -translate-x-1/2 bg-cyan-500 text-slate-900 text-[9px] font-black px-4 py-1.5 rounded-full z-10 shadow-xl opacity-0 transition-opacity"></div>
        <canvas id="pdfCanvas" class="hidden border border-slate-800 shadow-2xl shadow-cyan-900/20"></canvas>
        <canvas id="procCanvas" class="hidden"></canvas>
    </div>

    <div class="grid grid-cols-2 gap-3">
        <label class="bg-slate-800 p-4 rounded-2xl text-center text-xs font-bold border border-slate-700 cursor-pointer active:scale-95 transition-all">
            📂 ABRIR PDF
            <input type="file" accept="application/pdf" class="hidden" onchange="handleImport(event, 'pdf')">
        </label>
        <label class="bg-cyan-700 p-4 rounded-2xl text-center text-xs font-bold cursor-pointer active:scale-95 transition-all">
            📷 CAPTURAR
            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImport(event, 'img')">
        </label>
    </div>

    <div id="calibPanel" class="hidden bg-slate-900 border border-slate-700 p-5 rounded-3xl space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-[9px] font-bold text-slate-500 block mb-1">H MÁX (m)</label>
                <input type="number" id="hMaxScale" value="50" class="w-full bg-slate-800 p-3 rounded-xl font-bold border border-slate-700 outline-none">
            </div>
            <div>
                <label class="text-[9px] font-bold text-slate-500 block mb-1">Q MÁX (m³/h)</label>
                <input type="number" id="qMaxScale" value="100" class="w-full bg-slate-800 p-3 rounded-xl font-bold border border-slate-700 outline-none">
            </div>
        </div>
        <button onclick="lockAndAnalyze()" class="w-full bg-cyan-600 p-4 rounded-2xl font-black text-xs uppercase tracking-widest text-slate-900 shadow-lg shadow-cyan-900/30">
            Fijar Escala y Empezar
        </button>
    </div>

    <div id="resultsArea" class="hidden space-y-4">
         <button onclick="generarInforme()" class="w-full bg-emerald-600 p-5 rounded-[2rem] font-black text-sm uppercase tracking-widest shadow-xl">
            Descargar Reporte IA
        </button>
    </div>

</main>

<script src="app.js"></script>
</body>
</html>
